name: Git over CDN - Cloudflare

# Single workflow for both branches — uses github.ref_name so the file
# stays identical on master and dev (no PR merge conflicts on this yaml).
on:
  push:
    branches:
      - master
      - dev

  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Per-branch group: master deploy must not cancel an in-flight dev deploy
concurrency:
  group: git-over-cdn-pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Always build the branch that was pushed — not a hardcoded name
          ref: ${{ github.ref_name }}

      - name: Check Git
        run: |
          git --version
          echo "Current branch:"
          git branch --show-current
          echo "Current commit:"
          git rev-parse HEAD

      - name: Resolve Cloudflare project
        id: target
        run: |
          BRANCH="${{ github.ref_name }}"
          if [ "$BRANCH" = "master" ]; then
            PROJECT="narutoscript-update"
          else
            # dev (and any other non-master branch that triggers this workflow)
            PROJECT="narutoscript-update-dev"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Deploying branch=$BRANCH to project=$PROJECT"

      - name: Check files
        run: |
          echo "===== Scripts ====="
          find .github/scripts -maxdepth 2 -type f -print
          echo "==================="

      - name: Build Git over CDN
        run: |
          python .github/scripts/git_over_cdn.py \
            --branch "${{ steps.target.outputs.branch }}" \
            --history 5 \
            --output dist/git-over-cdn

      - name: Show generated files
        run: |
          echo "===== Generated files ====="
          find dist/git-over-cdn -type f -printf '%p %s bytes\n'
          echo "=========================="

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy dist/git-over-cdn
            --project-name=${{ steps.target.outputs.project }}
            --branch=${{ steps.target.outputs.branch }}
