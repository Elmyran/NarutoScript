name: Git over CDN - Cloudflare

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: git-over-cdn-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Check Git
        run: |
          git --version
          git rev-parse master

      - name: Build Git over CDN
        run: |
          python .github/scripts/build_git_over_cdn.py \
            --branch master \
            --history 5 \
            --output dist/git-over-cdn

      - name: Show generated files
        run: |
          echo "===== Generated files ====="
          find dist/git-over-cdn -type f -printf '%p %s bytes\n'
          echo "=========================="

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >
            pages deploy dist/git-over-cdn
            --project-name=narutoscript-update
